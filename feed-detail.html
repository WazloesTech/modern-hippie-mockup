<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="mock3.css"></head><body>
<main class="dpage">
  <div class="dtop"><a class="icbtn" id="back" href="home7.html#feed" aria-label="Back"><i data-ic="arrow-left"></i></a><h1 id="title">Post</h1></div>
  <div class="dop"><div class="dav"><i data-ic="user"></i></div><div><b>@wren</b><div class="dmeta" id="meta">2h · example post</div></div></div>
  <div id="vwrap" class="dvsoon" hidden><div class="vtile pimg"><i data-ic="video"></i><span>Video coming soon</span></div></div>
  <div id="pwrap" class="dvsoon" hidden><div class="ph pimg">photo</div></div>
  <p class="dbody" id="body">Example text post. This is the full post body. Comments nest below — reply to any comment, or open Continue thread when a branch gets deep.</p>
  <div class="dacts"><button type="button" class="icbtn tog" id="like" aria-label="Like"><i data-ic="thumbs-up"></i></button><button type="button" class="icbtn tog" id="save" aria-label="Save"><i data-ic="bookmark"></i></button></div>
  <p class="sect">Comments</p>
  <div class="cthread" id="thread"></div>
</main>
<div class="dcomposer">
  <span class="creplyhint" id="hint" hidden></span>
  <div class="dcomposerrow">
    <input id="reply" placeholder="Write a comment" aria-label="Comment">
    <button type="button" id="send">Comment</button>
  </div>
</div>
<script src="icons3.js"></script><script src="comments3.js"></script><script>
const $=id=>document.getElementById(id);
const P=new URLSearchParams(location.search);
const T=P.get('t')||'Example written post: what worked for me this week';
const from=P.get('from')||'home7.html#feed';
const type=(P.get('type')||(P.get('video')==='1'?'video':'written')).toLowerCase();
$('back').href=from;$('title').textContent=T;document.title=T;
if(type==='video'){$('vwrap').hidden=false;$('meta').textContent='1h · video post · 12 comments'}
else if(type==='photo'){$('pwrap').hidden=false;$('meta').textContent='2h · photo post · 5 comments'}
else $('meta').textContent='5h · written post · 18 comments';
const here=location.pathname.split('/').pop()+location.search;
function draw(){
  MHComments.render($('thread'),{postT:T,fromUrl:here});
}
paintIcons();
draw();
const composer=document.querySelector('.dcomposer');
composer._rerender=draw;
MHComments.wire($('thread'),composer);
document.querySelectorAll('.tog').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
</script></body></html>
