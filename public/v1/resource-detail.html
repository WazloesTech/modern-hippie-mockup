<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="mock3.css"></head><body>
<main class="dpage">
  <div class="dtop"><a class="icbtn" id="back" href="home7.html#res" aria-label="Back"><i data-ic="arrow-left"></i></a><h1 id="title">Resource</h1></div>
  <div class="rtype" id="rtype"><i data-ic="bookmark"></i><span id="rtypeLab">Link</span></div>
  <p class="dmeta rsrc" id="src">example.com/beginner-guide</p>
  <p class="dbody" id="desc">A short guide for people who are just starting out. It covers the first steps and common mistakes.</p>
  <div class="dbtns"><button type="button" class="asbtn pri" id="open">Open</button><button type="button" class="icbtn tog" id="save" aria-label="Save" data-tip="Save"><i data-ic="bookmark"></i></button></div>
</main>
<script src="icons3.js"></script><script>
const $=id=>document.getElementById(id);
const P=new URLSearchParams(location.search);
const T=P.get('t')||'Example resource: a beginner guide';
const typ=(P.get('type')||'link').toLowerCase();
const from=P.get('from')||'home7.html#res';
$('back').href=from;$('title').textContent=T;document.title=T;
$('rtypeLab').textContent=typ==='file'?'File':'Link';
if(typ==='file'){$('src').textContent='recommended-book.pdf · 2.4 MB';$('desc').textContent='A book members often recommend. Easy to read in a weekend.'}
paintIcons();
$('open').onclick=()=>{$('open').classList.add('on');$('open').textContent='Opened'};
$('save').onclick=()=>$('save').classList.toggle('on');
</script><script src="open3.js"></script></body></html>
