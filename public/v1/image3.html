<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="mock3.css"><style>main{padding-bottom:40px}.clip{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.clip br{display:none}</style></head><body><main>
<div class="topbar"><a class="icbtn" id="back" href="#" aria-label="Back"><i data-ic="chevron-left"></i></a><div><small id="crumb">Mind</small><h2>Images</h2></div></div>
<div class="ph" id="mainImg" style="height:260px;font-size:13px;margin:0">main image (full size)</div><p class="sect" id="mainBy" style="margin-top:8px"></p>
<button class="addbtn" id="add"><i data-ic="image-plus"></i>Add an image</button>
<p class="sect">All images, by votes</p>
<div id="list"></div>
</main><script src="icons3.js"></script><script>
const $=id=>document.getElementById(id);
const T=new URLSearchParams(location.search).get('t')||'Mind';$('crumb').textContent=T;
const F=new URLSearchParams(location.search).get('from')||('subtopic3.html?t='+encodeURIComponent(T));$('back').href=F+'#info';
const C=[{w:'@river',n:42},{w:'@sage',n:17},{w:'@juniper',n:58},{w:'@ash',n:5},{w:'@wren',n:23}];C.forEach(c=>c.v=0);
const row=c=>`<div class="ph" style="width:64px;height:64px">image</div><div class="body">${c.m?'<span class="tagmain">Main image</span><br>':''}Placeholder image<span class="who">added by ${c.w}</span></div>`;const showCur=c=>{$('mainBy').textContent='Main image · added by '+c.w+' · '+c.n+' votes'};
function draw(){C.sort((a,b)=>b.n-a.n);C.forEach((c,i)=>c.m=i==0);showCur(C[0]);
$('list').innerHTML=C.map((c,i)=>`<div class="cand">${row(c)}<div class="votes"><button class="${c.v>0?'on':''}" data-i="${i}" data-d="1" aria-label="Vote up"><i data-ic="chevron-up"></i></button><b>${c.n}</b><button class="${c.v<0?'on':''}" data-i="${i}" data-d="-1" aria-label="Vote down"><i data-ic="chevron-down"></i></button></div></div>`).join('');paintIcons($('list'))}
$('list').onclick=e=>{const b=e.target.closest('button');if(!b)return;const c=C[+b.dataset.i],d=+b.dataset.d;const nv=c.v==d?0:d;c.n+=nv-c.v;c.v=nv;draw()};
$('add').onclick=()=>{const n={w:'@you',n:1,v:1,t:'Your new placeholder image.'};C.push(n);draw()};
draw();
</script></body></html>
