<!doctype html><html lang="en-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset your password · Modern Hippie</title>
<link rel="stylesheet" href="mock3.css"></head><body>
<main class="auth" id="form">
  <div class="authhead"><h1>Reset your password</h1><p>Enter your email and we'll send you a reset link</p></div>
  <form class="cform" id="f" novalidate>
    <label class="cfield"><span>Email</span><span class="cin"><i data-ic="mail"></i><input type="email" id="email" placeholder="you@example.com" autocomplete="off"></span></label>
    <p class="cerr" id="err" hidden></p>
    <button type="submit" class="asbtn pri wide" id="go">Send reset link</button>
  </form>
  <p class="authfoot">Remember your password? <a href="login.html" id="toLogin">Log in</a></p>
</main>
<main class="auth" id="sent" hidden>
  <div class="authhead"><h1>Check your email</h1><p>We've sent a password reset link to <b id="who">you@example.com</b></p></div>
  <a class="authback" href="login.html" id="sentBack">Back to login</a>
</main>
<script src="icons3.js"></script><script>
// demo only: no email is sent.
const $=id=>document.getElementById(id);
const P=new URLSearchParams(location.search);
paintIcons();
if(P.get('sent')==='1'){$('form').hidden=true;$('sent').hidden=false;$('who').textContent=P.get('email')||'you@example.com';document.title='Check your email · Modern Hippie'}
$('f').onsubmit=e=>{e.preventDefault();
  const em=$('email').value.trim();
  if(!/^\S+@\S+\.\S+$/.test(em)){$('err').hidden=false;$('err').textContent='Please enter a valid email.';return}
  location.href='forgot-password.html?sent=1&email='+encodeURIComponent(em)};
</script><script src="open3.js"></script></body></html>
