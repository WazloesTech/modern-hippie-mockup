<!doctype html><html lang="en-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create new password · Modern Hippie</title>
<link rel="stylesheet" href="mock3.css"></head><body>
<main class="auth" id="form">
  <a class="icbtn authtop" id="back" href="login.html" aria-label="Back" hidden><i data-ic="arrow-left"></i></a>
  <div class="authhead"><h1>Create new password</h1><p>Enter a new password for your account</p></div>
  <form class="cform" id="f" novalidate>
    <label class="cfield"><span>New Password</span><span class="cin"><i data-ic="lock"></i><input type="password" id="pw" placeholder="At least 6 characters" autocomplete="off"></span></label>
    <label class="cfield"><span>Confirm Password</span><span class="cin"><i data-ic="lock"></i><input type="password" id="pw2" placeholder="Confirm your password" autocomplete="off"></span></label>
    <p class="cerr" id="err" hidden></p>
    <button type="submit" class="asbtn pri wide" id="go">Update password</button>
  </form>
</main>
<main class="auth" id="done" hidden>
  <div class="authhead"><h1>Password updated</h1><p id="doneMsg">Redirecting you to login...</p></div>
</main>
<script src="icons3.js"></script><script>
// demo only: nothing is saved. Opened from the reset email (real app) or Settings > Account > Change password.
const $=id=>document.getElementById(id);
const P=new URLSearchParams(location.search);
const from=P.get('from');
paintIcons();
if(from){$('back').hidden=false;$('back').href=from}
const next=from||'login.html';
function done(){
  $('form').hidden=true;$('done').hidden=false;document.title='Password updated · Modern Hippie';
  if(from)$('doneMsg').textContent='Taking you back...';
  if(P.get('flowmap')!=='1')setTimeout(()=>{location.href=next},2000);
}
if(P.get('done')==='1')done();
$('f').onsubmit=e=>{e.preventDefault();
  const a=$('pw').value,b=$('pw2').value;
  const err=a.length<6?'Password must be at least 6 characters.':a!==b?'Passwords do not match.':'';
  if(err){$('err').hidden=false;$('err').textContent=err;return}
  done()};
</script><script src="open3.js"></script></body></html>
