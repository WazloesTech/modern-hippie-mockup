<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redirect</title>
<script>
(function(){
  const P=new URLSearchParams(location.search);
  const t=P.get('t')||'';
  const from=P.get('from')||'home7.html#feed';
  const q=new URLSearchParams();
  if(t)q.set('t',t);
  q.set('type','written');
  q.set('from',from);
  location.replace('feed-detail.html?'+q.toString());
})();
</script>
<meta http-equiv="refresh" content="0;url=feed-detail.html">
</head><body><p><a id="a" href="feed-detail.html">Open post</a></p>
<script>document.getElementById('a').href='feed-detail.html?'+location.search.replace(/^\?/,'')+(location.search?'&':'')+'type=written';</script>
</body></html>
